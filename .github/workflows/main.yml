name: Flutter Build and Appetize Deploy

# این اکشن با هر بار Push کردن کد روی برانچ main اجرا می‌شود
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    # استفاده از سرور لینوکس ابری گیت‌هاب (رایگان)
    runs-on: ubuntu-latest

    steps:
    # ۱. دریافت کدهای پروژه از گیت‌هاب
    - name: Checkout code
      uses: actions/checkout@v4

    # ۲. نصب جاوا برای اندروید
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # ۳. نصب فلاتر
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # ۴. دریافت پکیج‌های فلاتر
    - name: Install dependencies
      run: flutter pub get

    # ۵. ساخت فایل APK اندروید (نسخه ریلیز)
    - name: Build APK
      run: flutter build apk --release

    # ۶. ارسال خودکار فایل APK به سایت Appetize.io
    - name: Upload APK to Appetize.io
      run: |
        RESPONSE=$(curl --request POST \
          --url https://appetize.io \
          --header "X-API-KEY: ${{ secrets.APPETIZE_TOKEN }}" \
          --form "file=@build/app/outputs/flutter-apk/app-release.apk" \
          --form "platform=android")
        
        # استخراج کد عمومی برنامه برای ساخت لینک امولاتور
        PUBLIC_URL=$(echo $RESPONSE | jq -r '.publicKey')
        echo "--------------------------------------------------------"
        echo "برنامه با موفقیت آپلود شد!"
        echo "لینک اجرای آنلاین امولاتور: https://appetize.io"
        echo "--------------------------------------------------------"
